name: Build and deploy Web game
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and single-thread Web templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -j /tmp/templates.zip 'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - name: Import, test and export
        shell: bash
        run: |
          set -euo pipefail
          godot=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$godot" --headless --editor --path . --import
          "$godot" --headless --path . --script tests/door_passage.gd
          "$godot" --headless --path . --script tests/issue_access.gd --quit-after 1800
          mkdir -p build/web
          "$godot" --headless --path . --export-release Web "build/web/game-${GITHUB_SHA}.html"
          mv "build/web/game-${GITHUB_SHA}.html" build/web/index.html
          cp CREDITS.txt build/web/CREDITS.txt
          test -s "build/web/game-${GITHUB_SHA}.pck"
          test -s "build/web/game-${GITHUB_SHA}.wasm"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
