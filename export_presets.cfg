[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/**/*.md,assets/**/*.txt"
exclude_filter="tests/*,QA_STATUS.md,README.md,build/*,assets/fonts/NotoSansCJKtc-Regular.otf"
export_path="build/web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<title>Shoddy Sweet Home | 裝潢蟑螂</title><style>#credits{position:fixed;right:8px;bottom:4px;z-index:20;color:#eee;background:#222c;padding:4px 8px;font:12px sans-serif}</style><script>window.addEventListener('DOMContentLoaded',()=>{const a=document.createElement('a');a.id='credits';a.href='CREDITS.txt';a.target='_blank';a.rel='noopener';a.textContent='Asset credits / 素材授權';document.body.appendChild(a);});</script>"
progressive_web_app/enabled=false
